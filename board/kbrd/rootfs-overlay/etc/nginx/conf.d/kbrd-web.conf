server {
  listen 80;
  # Has to agree with KBRD-API's own `MAX_CONTENT_LENGTH` and with
  # KBRD-WEB's `MAX_MEDIA_BYTES`: whichever is lowest is the real limit,
  # and a file refused here never reaches Flask to be explained.
  client_max_body_size 200m;

  root /var/www;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
