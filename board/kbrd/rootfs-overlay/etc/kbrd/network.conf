# Réglages réseau d'usine, livrés avec l'image.
#
# Rien ici n'est modifié sur l'appareil : ce que l'utilisateur enregistre
# depuis KBRD-WEB va dans /data/network/network.conf, sur la partition qui
# survit à un « make flash », et l'emporte clé par clé (voir
# /usr/bin/kbrd-network). Ce fichier n'est donc que le point de départ, et
# celui sur lequel on retombe quand /data a été effacée.
#
# Format : CLE=valeur, une par ligne, sans guillemets. Il n'est jamais
# « sourcé » — les valeurs de l'autre fichier viennent d'une requête HTTP.

# L'interface Wi-Fi du CM4.
INTERFACE=wlan0

# Le point d'accès du premier démarrage. Son SSID est complété par les
# quatre derniers caractères du numéro de série du CM4 (KBRD-9f3c), pour
# que deux claviers dans la même pièce ne diffusent pas le même nom.
HOTSPOT_SSID_PREFIX=KBRD
HOTSPOT_PASSPHRASE=kbrd-setup

# L'adresse sur laquelle on rejoint l'interface une fois associé au
# hotspot, et la plage que le serveur DHCP d'iwd distribue aux clients.
# Ni passerelle ni DNS ne sont annoncés : le clavier ne route rien, et
# annoncer une route par défaut qui ne mène nulle part couperait
# l'Internet du poste qui s'y connecte.
HOTSPOT_ADDRESS=192.168.100.1
HOTSPOT_NETMASK=255.255.255.0
HOTSPOT_RANGE=192.168.100.10,192.168.100.100
HOTSPOT_LEASE_TIME=3600

# Le canal 2,4 GHz du point d'accès. 6 par défaut, comme iwd.
HOTSPOT_CHANNEL=6

# Combien de secondes on laisse au Wi-Fi configuré pour obtenir une
# adresse avant de rebasculer sur le hotspot. C'est ce délai qui rend le
# clavier récupérable après un changement de box ou une clé erronée.
CONNECT_TIMEOUT=30
